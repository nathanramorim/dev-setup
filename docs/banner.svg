<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="dev-setup — CLI para reinstalar seu ambiente de dev sem sofrimento">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101322"/>
      <stop offset="100%" stop-color="#1c1f33"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- janela de terminal -->
  <g transform="translate(40,40)">
    <rect width="1120" height="240" rx="12" fill="#0b0d17" stroke="#2c3050" stroke-width="1.5"/>
    <rect width="1120" height="36" rx="12" fill="#181c2f"/>
    <circle cx="24" cy="18" r="6" fill="#ff5f57"/>
    <circle cx="46" cy="18" r="6" fill="#febc2e"/>
    <circle cx="68" cy="18" r="6" fill="#28c840"/>
    <text x="560" y="24" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13" fill="#7d84ab">setup.sh</text>

    <text x="36" y="90" font-family="Menlo, Consolas, monospace" font-size="20" fill="#7ee787">$ ./setup.sh</text>

    <text x="36" y="140" font-family="Menlo, Consolas, monospace" font-size="34" font-weight="bold" fill="#f5f7ff">dev-setup</text>
    <text x="36" y="172" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="18" fill="#a9b0d4">Formata o Mac, reinstala tudo em minutos — sem lembrar de nada.</text>

    <text x="36" y="212" font-family="Menlo, Consolas, monospace" font-size="14" fill="#4d5a8c">node · vscode · gh · dotfiles · e mais</text>
  </g>
</svg>
